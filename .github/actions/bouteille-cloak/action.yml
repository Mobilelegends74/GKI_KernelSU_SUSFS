name: 'Bouteille Cloak and SELinux patches'
description: 'Apply latest Bouteillepleine pathhide/map_files and SELinux oracle patches'

runs:
  using: composite
  steps:
    - name: Apply latest Bouteille Cloak
      shell: bash
      run: |
        set -euo pipefail

        SRC="${{ github.workspace }}/bouteille-kernel-patches"
        COMMON="${{ github.workspace }}/kernel/common"
        KSU="${{ github.workspace }}/kernel/KernelSU-Next"

        echo "=== Clone latest Bouteillepleine/kernel_patches ==="

        rm -rf "$SRC"

        git clone \
          --depth 1 \
          --single-branch \
          --branch main \
          https://github.com/Bouteillepleine/kernel_patches.git \
          "$SRC"

        SHA="$(git -C "$SRC" rev-parse HEAD)"
        SHORT_SHA="$(git -C "$SRC" rev-parse --short HEAD)"

        echo "BOUTEILLE_PATCHES_SHA=$SHA" >> "$GITHUB_ENV"
        echo "Bouteille kernel_patches: $SHA"

        HOOK="$SRC/common/_hook"
        PH="$SRC/common/_pathhide"

        apply_or_die() {
          local patch_file="$1"

          if [ ! -f "$patch_file" ]; then
            echo "::error::Missing patch: $patch_file"
            exit 1
          fi

          if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
            patch -p1 --forward < "$patch_file"

          elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
            echo "Already applied: $(basename "$patch_file")"

          else
            echo "::error::Cannot apply: $(basename "$patch_file")"
            exit 1
          fi
        }

        echo "=== SELinux oracle patches ==="

        dos2unix "$HOOK"/*.patch 2>/dev/null || true

        cd "$COMMON"

        apply_or_die "$HOOK/hide_selinux_selinuxfs.patch"
        apply_or_die "$HOOK/hide_selinux_attr.patch"
        apply_or_die "$HOOK/quiet_selinux_audit_legacy.patch"
        apply_or_die "$HOOK/quiet_selinux_audit_user.patch"

        echo "=== KernelSU SELinux seqno patch ==="

        cd "$KSU"
        apply_or_die "$HOOK/fix_selinux_seqno.patch"

        echo "=== PathHide maps/fd/map_files ==="

        cd "$COMMON"

        cp -f "$PH/pathhide.c" fs/pathhide.c
        cp -f "$PH/pathhide.h" fs/pathhide.h

        dos2unix \
          fs/pathhide.c \
          fs/pathhide.h \
          "$PH"/*.patch \
          2>/dev/null || true

        apply_or_die "$PH/pathhide_6.1_integration.patch"
        apply_or_die "$PH/pathhide_mapfiles_6.1_integration.patch"

        grep -qF 'obj-y += pathhide.o' fs/Makefile || \
          echo 'obj-y += pathhide.o' >> fs/Makefile

        echo "=== Verify PathHide ==="

        test -f fs/pathhide.c
        test -f fs/pathhide.h

        grep -q 'pathhide_match_file' fs/proc/task_mmu.c || {
          echo "::error::PathHide maps hook missing"
          exit 1
        }

        grep -q 'pathhide_match_file' fs/proc/fd.c || {
          echo "::error::PathHide fd hook missing"
          exit 1
        }

        grep -q 'pathhide_match_file' fs/proc/base.c || {
          echo "::error::PathHide map_files hook missing"
          exit 1
        }

        grep -qF 'obj-y += pathhide.o' fs/Makefile || {
          echo "::error::pathhide.o missing from Makefile"
          exit 1
        }

        grep -q 'proc_create(PH_PROC_NAME' fs/pathhide.c || {
          echo "::error::PathHide control interface missing"
          exit 1
        }

        REJECT="$(find "$COMMON" "$KSU" -type f -name '*.rej' -print -quit)"

        if [ -n "$REJECT" ]; then
          echo "::error::Patch reject found: $REJECT"
          exit 1
        fi

        echo "PathHide + SELinux patches OK: $SHORT_SHA"

        {
          echo "### Bouteille Cloak"
          echo
          echo "- kernel_patches branch: main"
          echo "- Commit: $SHA"
          echo "- PathHide maps: enabled"
          echo "- PathHide fd: enabled"
          echo "- PathHide map_files: enabled"
          echo "- SELinux oracle patches: enabled"
        } >> "$GITHUB_STEP_SUMMARY"
