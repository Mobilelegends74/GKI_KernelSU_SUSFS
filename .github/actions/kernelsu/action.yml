name: Setup Wild KSU
description: Download and configure Wild KSU with version tracking
inputs:
  ksu_branch:
    description: 'KernelSU branch or commit (empty = latest dev-susfs branch tip)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download Wild KSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev-susfs"
        fi
        KSU_SOURCE_REF="$KSU_INPUT"

        # Try as branch first, fall back to commit
        if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Using KernelSU-Next branch: $KSU_INPUT"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          git -C KernelSU-Next/kernel fetch --no-tags origin \
            "+refs/heads/${KSU_INPUT}:refs/remotes/origin/${KSU_INPUT}"
          git -C KernelSU-Next/kernel checkout -B "$KSU_INPUT" \
            "refs/remotes/origin/${KSU_INPUT}"
        else
          echo "Using KernelSU-Next commit: $KSU_INPUT"
          KSU_SOURCE_REF="dev-susfs"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          git -C KernelSU-Next/kernel fetch --no-tags origin "$KSU_INPUT"
          # Keep the selected commit on the known source branch name so the
          # upstream Kbuild resolves dev-susfs -> dev to the same base ref.
          git -C KernelSU-Next/kernel checkout -B "$KSU_SOURCE_REF" "$KSU_INPUT"
        fi

        KSU_SOURCE_TREE="${PWD}/KernelSU-Next/kernel"
        KSU_GIT_ROOT="$(git -C "$KSU_SOURCE_TREE" rev-parse --show-toplevel)"
        KSU_KBUILD="${KSU_SOURCE_TREE}/Kbuild"

        if [ ! -f "$KSU_KBUILD" ]; then
          echo "::error::KernelSU Next Kbuild was not found at $KSU_KBUILD"
          exit 1
        fi

        # The selected source ref is authoritative. Match upstream Kbuild's
        # dev-susfs -> dev mapping without deriving it from the checkout state.
        BASE_BRANCH="$(printf '%s\n' "$KSU_SOURCE_REF" | sed 's:-.*::')"
        if [ -z "$BASE_BRANCH" ]; then
          echo "::error::Unable to derive the KernelSU Next base branch from $KSU_SOURCE_REF"
          exit 1
        fi

        SOURCE_REMOTE_REF="refs/remotes/origin/${KSU_SOURCE_REF}"
        BASE_REMOTE_REF="refs/remotes/origin/${BASE_BRANCH}"
        FETCH_REFS=(
          "+refs/heads/${KSU_SOURCE_REF}:${SOURCE_REMOTE_REF}"
          "+refs/heads/${BASE_BRANCH}:${BASE_REMOTE_REF}"
        )

        if [ "$(git -C "$KSU_GIT_ROOT" rev-parse --is-shallow-repository)" = "true" ]; then
          git -C "$KSU_GIT_ROOT" fetch --unshallow --no-tags origin "${FETCH_REFS[@]}"
        else
          git -C "$KSU_GIT_ROOT" fetch --no-tags origin "${FETCH_REFS[@]}"
        fi

        GIT_SHALLOW="$(git -C "$KSU_GIT_ROOT" rev-parse --is-shallow-repository)"
        if [ "$GIT_SHALLOW" != "false" ]; then
          echo "::error::KernelSU Next repository is still shallow after fetching full history"
          exit 1
        fi
        if ! git -C "$KSU_GIT_ROOT" show-ref --verify --quiet "$SOURCE_REMOTE_REF"; then
          echo "::error::Missing exact KernelSU Next source ref: $SOURCE_REMOTE_REF"
          exit 1
        fi
        if ! git -C "$KSU_GIT_ROOT" show-ref --verify --quiet "$BASE_REMOTE_REF"; then
          echo "::error::Missing exact KernelSU Next base ref: $BASE_REMOTE_REF"
          exit 1
        fi

        KSU_COMMIT_FULL="$(git -C "$KSU_GIT_ROOT" rev-parse 'HEAD^{commit}')"
        KSU_COMMIT_SHORT="${KSU_COMMIT_FULL:0:7}"
        if ! BASE_COMMIT="$(git -C "$KSU_GIT_ROOT" merge-base "$KSU_COMMIT_FULL" "$BASE_REMOTE_REF")" || [ -z "$BASE_COMMIT" ]; then
          echo "::error::Unable to find merge-base between $KSU_COMMIT_FULL and $BASE_REMOTE_REF"
          exit 1
        fi
        COMMITS_COUNT="$(git -C "$KSU_GIT_ROOT" rev-list --count "$BASE_COMMIT")"
        if [[ ! "$COMMITS_COUNT" =~ ^[0-9]+$ ]] || [ "$COMMITS_COUNT" -eq 0 ]; then
          echo "::error::Invalid KernelSU Next base commit count: $COMMITS_COUNT"
          exit 1
        fi
        KSU_VERSION=$((30000 + COMMITS_COUNT))
        sed -i -E \
          "s/^KSU_VERSION_FALLBACK := [0-9]+$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" \
          "$KSU_KBUILD"
        if ! grep -qx "KSU_VERSION_FALLBACK := ${KSU_VERSION}" "$KSU_KBUILD"; then
          echo "::error::Failed to store calculated KernelSU Next version in Kbuild"
          exit 1
        fi

        KSU_GIT_TAG="$(git -C "$KSU_GIT_ROOT" describe --tags --abbrev=0 "$BASE_COMMIT" 2>/dev/null || echo "v0.0.1")"
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" "$KSU_KBUILD"

        {
          echo "KSU_SOURCE_REF=$KSU_SOURCE_REF"
          echo "KSU_GIT_TAG=$KSU_GIT_TAG"
          echo "KSU_VERSION=$KSU_VERSION"
          echo "KSU_COMMIT=$KSU_COMMIT_SHORT"
          echo "KSUN_COMMIT=$KSU_COMMIT_FULL"
          echo "KSU_BASE_BRANCH=$BASE_BRANCH"
          echo "KSU_BASE_COMMIT=$BASE_COMMIT"
          echo "KSU_COMMITS_COUNT=$COMMITS_COUNT"
          echo "KSU_GIT_SHALLOW=$GIT_SHALLOW"
        } > "${GITHUB_WORKSPACE}/ksu-build-metadata.env"
        cat "${GITHUB_WORKSPACE}/ksu-build-metadata.env" >> "$GITHUB_ENV"
        echo "KSU_GIT_ROOT=$KSU_GIT_ROOT" >> "$GITHUB_ENV"

        echo "KernelSU Next version metadata resolved from $KSU_GIT_ROOT"

    - name: 'Fix KernelSU-Next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        cp ${{ github.action_path }}/patches/static.patch "${{ github.workspace }}/kernel/KernelSU-Next/static.patch"
        patch -p1 < static.patch

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
