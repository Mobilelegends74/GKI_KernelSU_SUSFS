name: Setup Wild KSU
description: Download and configure Wild KSU with version tracking
inputs:
  ksu_branch:
    description: 'KernelSU branch or commit (empty = latest dev-susfs branch tip)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download Wild KSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev-susfs"
        fi
        KSU_VERSION_REF="$KSU_INPUT"

        # Try as branch first, fall back to commit
        if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Using KernelSU-Next branch: $KSU_INPUT"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          git -C KernelSU-Next/kernel fetch --no-tags origin \
            "+refs/heads/${KSU_INPUT}:refs/remotes/origin/${KSU_INPUT}"
          git -C KernelSU-Next/kernel checkout -B "$KSU_INPUT" \
            "refs/remotes/origin/${KSU_INPUT}"
        else
          echo "Using KernelSU-Next commit: $KSU_INPUT"
          KSU_VERSION_REF="dev-susfs"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          git -C KernelSU-Next/kernel fetch --no-tags origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "$KSU_INPUT"
        fi

        cd KernelSU-Next/kernel

        # Kbuild derives the version from the common history with the base
        # branch (dev-susfs -> dev). A shallow HEAD count is not equivalent.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --unshallow --no-tags origin
        fi

        BASE_BRANCH="$(git rev-parse --abbrev-ref HEAD | sed 's:-.*::')"
        if [ "$BASE_BRANCH" = "HEAD" ]; then
          BASE_BRANCH="$(printf '%s\n' "$KSU_VERSION_REF" | sed 's:-.*::')"
        fi
        git fetch --no-tags origin \
          "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
        BASE_COMMIT="$(git merge-base HEAD "refs/remotes/origin/${BASE_BRANCH}")"
        COMMITS_COUNT="$(git rev-list --count "$BASE_COMMIT")"
        KSU_VERSION=$((30000 + COMMITS_COUNT))
        sed -i -E \
          "s/^KSU_VERSION_FALLBACK := [0-9]+$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" \
          Kbuild
        if ! grep -qx "KSU_VERSION_FALLBACK := ${KSU_VERSION}" Kbuild; then
          echo "::error::Failed to store calculated KernelSU Next version in Kbuild"
          exit 1
        fi

        echo "KernelSU Next ref: $KSU_VERSION_REF"
        echo "KernelSU Next commit: $(git rev-parse --short=8 HEAD)"
        echo "KernelSU Next base branch: $BASE_BRANCH"
        echo "KernelSU Next base commit: $BASE_COMMIT"
        echo "KernelSU Next base commit count: $COMMITS_COUNT"
        echo "KernelSU Next calculated version: $KSU_VERSION"

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
    
    - name: Extract Built KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next/kernel
      run: |
        set -euo pipefail

        KSU_SOURCE_REF="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_SOURCE_REF" ]; then
          KSU_SOURCE_REF="dev-susfs"
        fi

        # Read the exact values written to the Kbuild used by this build.
        KSU_VERSION="$(sed -n 's/^KSU_VERSION_FALLBACK := //p' Kbuild | head -n 1)"
        KSU_GIT_TAG="$(sed -n 's/^KSU_VERSION_TAG_FALLBACK := //p' Kbuild | head -n 1)"
        KSU_COMMIT="$(git rev-parse --short=7 HEAD)"

        if [[ ! "$KSU_VERSION" =~ ^[0-9]+$ ]]; then
          echo "::error::Invalid built KernelSU Next version: $KSU_VERSION"
          exit 1
        fi

        echo "Built KernelSU Next ref: $KSU_SOURCE_REF"
        echo "Built KernelSU Next commit: $KSU_COMMIT"
        echo "Built KernelSU Next version: $KSU_VERSION"
        echo "Built KernelSU Next tag: $KSU_GIT_TAG"

        echo "KSU_SOURCE_REF=$KSU_SOURCE_REF" >> "$GITHUB_ENV"
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

    - name: 'Fix KernelSU-Next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        cp ${{ github.action_path }}/patches/static.patch "${{ github.workspace }}/kernel/KernelSU-Next/static.patch"
        patch -p1 < static.patch

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
