name: 'Setup Maxsteel NoMount'
description: 'Integrate the latest published stable maxsteeel NoMount release'

runs:
  using: composite
  steps:

    - name: Download Maxsteel NoMount
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        NM_SRC="${{ github.workspace }}/nomount-maxsteel"
        NM_RELEASE_JSON="$(python3 "$GITHUB_WORKSPACE/scripts/resolve-nomount-stable.py")"
        NM_TAG="$(jq -er .nomount_tag <<< "$NM_RELEASE_JSON")"
        EXPECTED_NM_SHA="$(jq -er .nomount_sha <<< "$NM_RELEASE_JSON")"

        rm -rf "$NM_SRC"

        git clone \
          --depth 1 \
          --single-branch \
          --branch "$NM_TAG" \
          https://github.com/maxsteeel/nomount.git \
          "$NM_SRC"

        NM_SHA="$(git -C "$NM_SRC" rev-parse HEAD)"

        test "$NM_SHA" = "$EXPECTED_NM_SHA" || {
          echo "::error::NoMount release tag changed after resolution"; exit 1;
        }
        echo "NoMount stable $NM_TAG SHA: $NM_SHA"
        echo "NOMOUNT_SHA=$NM_SHA" >> "$GITHUB_ENV"
        echo "NOMOUNT_TAG=$NM_TAG" >> "$GITHUB_ENV"

    - name: Install NoMount Source
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        mkdir -p fs/nomount

        cp -a "${{ github.workspace }}/nomount-maxsteel/kernel/src/." fs/nomount/

        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || \
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || \
          echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig

    - name: Verify NoMount
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        test -f fs/nomount/nomount.c
        test -f fs/nomount/nomount.h
        test -f fs/nomount/Kconfig
        test -f fs/nomount/Makefile

        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile
        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig

    - name: Enable Kernel Config
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_NOMOUNT=y
