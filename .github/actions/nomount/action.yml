name: 'Setup Maxsteel NoMount'
description: 'Integrate latest maxsteeel NoMount dev'

runs:
  using: composite
  steps:

    - name: Download Maxsteel NoMount
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        NM_SRC="${{ github.workspace }}/nomount-maxsteel"

        rm -rf "$NM_SRC"

        git clone \
          --depth 1 \
          --single-branch \
          --branch dev \
          https://github.com/maxsteeel/nomount.git \
          "$NM_SRC"

        NM_SHA="$(git -C "$NM_SRC" rev-parse HEAD)"

        echo "NoMount dev SHA: $NM_SHA"
        echo "NOMOUNT_SHA=$NM_SHA" >> "$GITHUB_ENV"

    - name: Install NoMount Source
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        mkdir -p fs/nomount

        cp -f "${{ github.workspace }}/nomount-maxsteel/kernel/src/"* fs/nomount/

        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || \
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || \
          echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig

    - name: Verify NoMount
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        test -f fs/nomount/nomount.c
        test -f fs/nomount/nomount.h
        test -f fs/nomount/Kconfig
        test -f fs/nomount/Makefile

        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile
        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig

    - name: Enable Kernel Config
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_NOMOUNT=y
