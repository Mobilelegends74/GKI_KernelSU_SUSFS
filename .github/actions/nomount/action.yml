name: 'Setup Maxsteel NoMount'

description: 'Integrate maxsteeel NoMount dev'

runs:
  using: composite
  steps:
    - name: Integrate Maxsteel NoMount
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        echo "=== Clone maxsteeel NoMount dev ==="

        NM_SRC="${{ github.workspace }}/nomount-maxsteel"

        rm -rf "$NM_SRC"

        git clone \
          --depth 1 \
          --single-branch \
          --branch dev \
          https://github.com/maxsteeel/nomount.git \
          "$NM_SRC"

        echo "=== Install NoMount source ==="

        mkdir -p fs/nomount

        cp -f "$NM_SRC/kernel/src/"* fs/nomount/

        echo "=== Apply Linux 6.1 integration patch ==="

        patch -p1 --forward --fuzz=1 < \
          "$NM_SRC/kernel/patches/nomount_6.1_kernel_integration.patch"

        echo "=== Verify NoMount ==="

        test -f fs/nomount/nomount.c
        test -f fs/nomount/nomount.h

        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile
        grep -q 'config NOMOUNT' fs/Kconfig

        echo "=== Maxsteel NoMount integrated ==="
