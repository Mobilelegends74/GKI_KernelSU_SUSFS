name: Build GKI 6.1.145 with SUSFS

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - WKSU+SUSFS+BBG
          - WKSU+BBG
          - WKSU
          - BBG
          - None
        default: WKSU+SUSFS+BBG

      ksu_commit:
        description: "KSU Commit / Branch / Tag optional"
        type: string
        default: ""
        required: false

      susfs_android14_6_1_ref:
        description: "SUSFS branch or commit for android14-6.1"
        type: string
        default: "gki-android14-6.1"
        required: false

jobs:
  fetch-commits:
    runs-on: ubuntu-latest

    outputs:
      ksu_commit: ${{ steps.fetch.outputs.ksu_commit }}
      anykernel_commit: ${{ steps.fetch.outputs.anykernel_commit }}
      patches_commit: ${{ steps.fetch.outputs.patches_commit }}
      susfs_commit: ${{ steps.resolve-susfs.outputs.susfs_commit }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch base commits
        id: fetch
        uses: ./.github/actions/fetch-commits
        with:
          ksu_commit: ${{ inputs.ksu_commit }}

      - name: Resolve SUSFS commit from simonpunk/susfs4ksu
        id: resolve-susfs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="simonpunk%2Fsusfs4ksu"
          SUSFS_REF="${{ inputs.susfs_android14_6_1_ref }}"

          echo "Resolving SUSFS ref: $SUSFS_REF"

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5
          resolved=""

          until [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; do
            RESULT=$(curl -s --fail "https://gitlab.com/api/v4/projects/${PROJECT_ID}/repository/commits/${SUSFS_REF}" || true)

            if [ -n "$RESULT" ]; then
              resolved=$(echo "$RESULT" | jq -r '.id // empty')
              if [ -n "$resolved" ] && [ "$resolved" != "null" ]; then
                echo "Resolved SUSFS: $SUSFS_REF -> $resolved"
                break
              fi
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "GitLab API failed, attempt $RETRY_COUNT/$MAX_RETRIES. Retrying..."
            sleep "$RETRY_DELAY"
          done

          if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
            echo "::error::Could not resolve SUSFS ref '$SUSFS_REF' on GitLab."
            exit 1
          fi

          echo "susfs_commit=$resolved" >> "$GITHUB_OUTPUT"

  build-6-1-145:
    name: Build 6.1.145-android14-2025-09
    needs: fetch-commits
    uses: ./.github/workflows/build.yml
    with:
      kernel_version: 6.1.145-android14-2025-09
      ksu_commit: ${{ inputs.ksu_commit || needs.fetch-commits.outputs.ksu_commit }}
      anykernel_commit: ${{ needs.fetch-commits.outputs.anykernel_commit }}
      patches_commit: ${{ needs.fetch-commits.outputs.patches_commit }}
      susfs_commit: ${{ needs.fetch-commits.outputs.susfs_commit }}
      feature_set: ${{ inputs.feature_set }}
    secrets: inherit
